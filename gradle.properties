org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# tor-android 0.4.9.12's AAR asks for compile SDK 37.1 (its aar-metadata
# minCompileSdk), which AGP 8.13.2 builds against with a warning. targetSdk
# stays 36. Remove with the AGP that supports 37.1.
android.suppressUnsupportedCompileSdk=37.1
