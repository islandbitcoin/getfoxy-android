name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-and-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conformance/package-lock.json

      - name: The iOS repository at the pinned commit
        run: |
          commit=$(sed -n 's/^commit=//p' core/PIN)
          repo=$(sed -n 's/^repo=//p' core/PIN)
          git init --quiet "$RUNNER_TEMP/ios"
          git -C "$RUNNER_TEMP/ios" fetch --quiet --depth 1 "$repo" "$commit"
          git -C "$RUNNER_TEMP/ios" cat-file -e "$commit^{commit}"
          echo "FOXY_IOS_REF=$RUNNER_TEMP/ios" >> "$GITHUB_ENV"

      - name: core/web is the pinned iOS Web/, byte for byte
        run: tools/verify-core.sh --against "$FOXY_IOS_REF"

      - name: Install the conformance suite
        working-directory: conformance
        run: npm ci

      - name: Conformance
        working-directory: conformance
        run: npm test

      - name: docs/BRIDGE.md matches contract.json
        run: node conformance/tools/contract-table.js --check

      - name: The leak test's analysis (tools/leak-check.js) and the money rules (tools/real-money.js)
        run: node --test tools/leak-check.test.js tools/fake-invoice.test.js tools/real-money.test.js

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17

      # compile SDK 37.1: tor-android 0.4.9.12's AAR asks for it (targetSdk stays 36)
      - name: Android SDK 37.1
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.1" "build-tools;36.0.0" > /dev/null

      - name: No network code outside network/
        run: tools/check-no-network.sh && tools/check-no-network.test.sh

      # Dependency verification is strict (gradle/verification-metadata.xml): an
      # artifact this Linux runner resolves that the file does not pin fails here.
      - name: Unit tests, lint, the debug APK and the instrumented-test APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: The debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foxy-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
