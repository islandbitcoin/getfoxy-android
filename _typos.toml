# The typos spell check (`typos` at the repository root). Left out: what is
# not this repository's own text and cannot be edited here, core/ (the iOS
# page, byte for byte, tools/verify-core.sh) and the test fixtures copied from
# the iOS repository unchanged (app/src/test/resources/fixtures/README.md),
# whose tokens and bytewords are random letters.
[files]
extend-exclude = [
    "core/",
    "app/src/test/resources/fixtures/*.json",
]

# Invoice and payment-request vectors copied from FoxyTests/TapProtocolTests.swift
# (bech32 and base64, not words).
[default]
extend-ignore-re = [
    "lnbc10n1[A-Za-z0-9]*",
    "creqA[A-Za-z0-9_=+/-]*",
]
