# Every pin is an exact version released at least three days before it was
# pinned (the PR lists each with its release date). The artifacts' SHA-256
# sums are in gradle/verification-metadata.xml, and verification is strict.
[versions]
agp = "8.13.2"
kotlin = "2.2.21"
webkit = "1.15.0"
coreKtx = "1.17.0"
activity = "1.11.0"
splashscreen = "1.2.0"
lifecycle = "2.9.4"
secp256k1 = "0.22.0"
junit = "4.13.2"
torAndroid = "0.4.9.12"
iptproxy = "5.5.0"
jtorctl = "0.4.5.7"
okhttp = "4.12.0"
camerax = "1.5.3"
zxingCpp = "3.0.2"
zxingCore = "3.5.4"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestRules = "1.7.0"
androidxTestExtJunit = "1.3.0"

[libraries]
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
secp256k1-jni-android = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-android", version.ref = "secp256k1" }
secp256k1-jni-jvm = { module = "fr.acinq.secp256k1:secp256k1-kmp-jni-jvm", version.ref = "secp256k1" }
junit = { module = "junit:junit", version.ref = "junit" }
tor-android = { module = "info.guardianproject:tor-android", version.ref = "torAndroid" }
iptproxy = { module = "com.netzarchitekten:IPtProxy", version.ref = "iptproxy" }
jtorctl = { module = "info.guardianproject:jtorctl", version.ref = "jtorctl" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-cpp = { module = "io.github.zxing-cpp:android", version.ref = "zxingCpp" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxingCore" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
